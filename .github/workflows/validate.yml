name: Validate Foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate contract JSON
        run: python -m json.tool specifications/foundation-contract.instance.json >/dev/null
      - name: Validate repository foundation
        run: python tools/validate-foundation.py
      - name: Validate Python tooling syntax
        run: python -m compileall -q tools tests
