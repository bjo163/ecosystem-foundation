name: Validate Foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate contract JSON
        run: python -m json.tool specifications/foundation-contract.json >/dev/null
      - name: Validate contract instance JSON
        run: python -m json.tool specifications/foundation-contract.instance.json >/dev/null
      - name: Validate repository foundation
        run: python tools/validate-foundation.py
      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate Python tooling syntax
        run: python -m compileall -q tools tests

      - uses: dtolnay/rust-toolchain@stable
      - name: Check ecosystem-init
        working-directory: tools/ecosystem-init
        run: cargo check
      - name: Test ecosystem-init
        working-directory: tools/ecosystem-init
        run: cargo test --all-targets
